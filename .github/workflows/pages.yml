# 部署到 GitHub Pages：单测通过才允许部署（门禁）
#
# 使用前在仓库 Settings → Pages → Source 选择 "GitHub Actions"（不是 Deploy from a branch）。
# 触发：push 到 main，或手动触发（Actions 页 → Run workflow）。

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ── 门禁：引擎层单测必须全绿 ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test

  # ── 部署：仅当 test 成功 ──
  deploy:
    needs: test
    if: success()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
